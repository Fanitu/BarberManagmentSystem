<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barber Management System</title>
    
    <!-- Preconnect for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Roboto+Slab:wght@500;700&display=swap"
      rel="stylesheet"
    />
    
    <!-- ✅ LOADING SCREEN - Matching your ledger theme -->
    <style>
      /* ============================================
         DESIGN DIRECTION: "THE LEDGER"
         Matching your tokens.css exactly
         ============================================ */

      /* Reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Base styles matching your theme */
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        background: #f6f1e7; /* Your --paper color */
        color: #1f2a24; /* Your --ink color */
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* ============================================
         LOADING SCREEN - LEDGER THEME
         ============================================ */

      #loading-screen {
        position: fixed;
        inset: 0;
        background: #f6f1e7; /* --paper */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: "Inter", system-ui, sans-serif;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                    visibility 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        padding: 20px;
      }

      /* Completely remove from DOM when done */
      #loading-screen.removed {
        display: none !important;
      }

      #loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* ============================================
         LEDGER-INSPIRED LOADING ELEMENTS
         ============================================ */

      /* Receipt tape border effect */
      #loading-screen::before {
        content: '';
        position: absolute;
        inset: 20px;
        border: 1px solid #d8cfba; /* --line */
        pointer-events: none;
        opacity: 0.5;
      }

      #loading-screen::after {
        content: '✂️ BARBER LEDGER';
        position: absolute;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        font-family: "IBM Plex Mono", monospace;
        font-size: 10px;
        letter-spacing: 3px;
        color: #5b6b60; /* --ink-soft */
        opacity: 0.3;
        text-transform: uppercase;
      }

      /* Header line - like a receipt header */
      .loader-header {
        width: 280px;
        max-width: 90%;
        border-bottom: 2px solid #d8cfba; /* --line */
        padding-bottom: 16px;
        margin-bottom: 24px;
        text-align: center;
        position: relative;
      }

      .loader-header::after {
        content: '✦ ✦ ✦';
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        background: #f6f1e7; /* --paper */
        padding: 0 12px;
        font-size: 10px;
        letter-spacing: 4px;
        color: #b8862e; /* --brass */
        opacity: 0.6;
      }

      /* Spinner - inspired by cash register */
      .loader-spinner {
        position: relative;
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
      }

      /* Register ring - green like money */
      .loader-spinner .ring {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 3px solid #d8cfba; /* --line */
        border-top-color: #1b5e3f; /* --register-green */
        border-right-color: #b8862e; /* --brass */
        border-bottom-color: #1b5e3f; /* --register-green */
        border-left-color: #a13d2c; /* --debt-red */
        animation: spin 1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      /* Scissors in center */
      .loader-spinner .icon {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 32px;
        animation: pulse 1.5s ease-in-out infinite;
        opacity: 0.8;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%, 100% {
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.1);
        }
      }

      /* Title - using your display font */
      .loader-title {
        font-family: "Roboto Slab", "Georgia", serif;
        font-size: 28px;
        font-weight: 700;
        color: #1f2a24; /* --ink */
        letter-spacing: 0.5px;
        margin-bottom: 4px;
      }

      .loader-title .highlight {
        color: #1b5e3f; /* --register-green */
      }

      /* Subtitle - receipt style */
      .loader-subtitle {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        color: #5b6b60; /* --ink-soft */
        letter-spacing: 1px;
        font-variant-numeric: tabular-nums;
      }

      /* Progress bar - like a receipt tape */
      .loader-progress-container {
        width: 240px;
        max-width: 80%;
        height: 2px;
        background: #d8cfba; /* --line */
        border-radius: 2px;
        margin-top: 28px;
        overflow: hidden;
        position: relative;
      }

      .loader-progress-bar {
        height: 100%;
        width: 0%;
        background: #1b5e3f; /* --register-green */
        border-radius: 2px;
        animation: loadProgress 2.5s ease-in-out infinite;
        position: relative;
      }

      /* Shimmer effect - cash register glow */
      .loader-progress-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(90deg,
          transparent,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        animation: shimmer 1.8s ease-in-out infinite;
      }

      @keyframes loadProgress {
        0% { width: 0%; }
        50% { width: 75%; }
        100% { width: 100%; }
      }

      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      /* Loading dots - ledger style */
      .loader-dots {
        display: inline-flex;
        gap: 4px;
        margin-left: 6px;
        vertical-align: middle;
      }

      .loader-dots span {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #b8862e; /* --brass */
        animation: dotBounce 1.4s ease-in-out infinite;
      }

      .loader-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .loader-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes dotBounce {
        0%, 80%, 100% {
          transform: scale(0.6);
          opacity: 0.3;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* Version - like a receipt footer */
      .loader-version {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        font-family: "IBM Plex Mono", monospace;
        font-size: 10px;
        color: #5b6b60; /* --ink-soft */
        opacity: 0.2;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      /* Decorative elements - receipt style */
      .loader-decor {
        font-family: "IBM Plex Mono", monospace;
        font-size: 10px;
        color: #d8cfba; /* --line */
        letter-spacing: 2px;
        margin-top: 20px;
        opacity: 0.5;
      }

      /* ============================================
         RESPONSIVE
         ============================================ */

      @media (max-width: 640px) {
        #loading-screen::before {
          inset: 12px;
        }
        #loading-screen::after {
          font-size: 8px;
          top: 20px;
          letter-spacing: 2px;
        }
        .loader-title {
          font-size: 22px;
        }
        .loader-spinner {
          width: 60px;
          height: 60px;
        }
        .loader-spinner .icon {
          font-size: 24px;
        }
        .loader-progress-container {
          width: 180px;
        }
        .loader-subtitle {
          font-size: 11px;
        }
        .loader-header {
          width: 200px;
        }
      }

      @media (max-width: 400px) {
        .loader-title {
          font-size: 18px;
        }
        .loader-spinner {
          width: 50px;
          height: 50px;
        }
        .loader-spinner .icon {
          font-size: 20px;
        }
        .loader-progress-container {
          width: 140px;
        }
        .loader-subtitle {
          font-size: 10px;
        }
        #loading-screen::after {
          font-size: 7px;
          top: 16px;
        }
      }

      /* ============================================
         REDUCED MOTION
         ============================================ */

      @media (prefers-reduced-motion: reduce) {
        #loading-screen * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- ✅ LOADING SCREEN - LEDGER THEME -->
    <div id="loading-screen" role="status" aria-label="Loading barber ledger">
      
      <!-- Receipt-style header -->
      <div class="loader-header">
        <div class="loader-title">
          <span class="highlight">✂️</span> Barber
        </div>
        <div class="loader-subtitle">
          LEDGER
          <span class="loader-dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </div>
      </div>

      <!-- Spinner -->
      <div class="loader-spinner">
        <div class="ring"></div>
        <div class="icon" aria-hidden="true">✂️</div>
      </div>

      <!-- Progress -->
      <div class="loader-progress-container" aria-hidden="true">
        <div class="loader-progress-bar"></div>
      </div>

      <!-- Decorative footer -->
      <div class="loader-decor">— — — — —</div>
      
      <div class="loader-version">v2.0.0</div>
    </div>

    <!-- React App Mount Point -->
    <div id="root"></div>

    <!-- ✅ Loading Screen Controller -->
    <script>
      (function() {
        'use strict';

        const loadingScreen = document.getElementById('loading-screen');
        let isHidden = false;

        // Hide loading screen function
        function hideLoadingScreen() {
          if (isHidden || !loadingScreen) return;
          
          loadingScreen.classList.add('hidden');
          isHidden = true;
          
          // Completely remove after animation
          setTimeout(() => {
            if (loadingScreen && loadingScreen.parentNode) {
              loadingScreen.classList.add('removed');
              // Optional: Completely remove from DOM
              // loadingScreen.parentNode.removeChild(loadingScreen);
            }
          }, 700);
        }

        // Expose globally for React
        window.__hideLoadingScreen = hideLoadingScreen;

        // Multiple hide strategies
        window.addEventListener('load', function() {
          setTimeout(hideLoadingScreen, 500);
        });

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          setTimeout(hideLoadingScreen, 300);
        }

        // Ultimate fallback
        setTimeout(hideLoadingScreen, 4000);

        // Hide on user interaction
        const events = ['click', 'touchstart', 'keydown', 'scroll'];
        function onUserInteraction() {
          hideLoadingScreen();
          events.forEach(event => {
            document.removeEventListener(event, onUserInteraction);
          });
        }
        events.forEach(event => {
          document.addEventListener(event, onUserInteraction, { once: true, passive: true });
        });

      })();
    </script>

    <!-- Your Main Script -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
